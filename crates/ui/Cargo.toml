[package]
name = "manifold-ui"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Dual-pane GUI state store, virtualized 500k+ entry viewport, Slint declarative components, and modals for Manifold"

[dependencies]
# Feature-carrier only (see workspace comment + cargo-machete ignore):
# enables fontique's fontconfig-dlopen for the transitive
# yeslogic-fontconfig-sys build.
fontique.workspace = true
libc.workspace = true
manifold-config.workspace = true
manifold-preview.workspace = true
manifold-sync.workspace = true
manifold-transfer.workspace = true
manifold-vfs.workspace = true
manifold-vfs-remote.workspace = true
serde.workspace = true
serde_json.workspace = true
slint.workspace = true

[dev-dependencies]
tempfile.workspace = true


# fontique is a feature-carrier, not a code dependency (R15).
[package.metadata.cargo-machete]
ignored = ["fontique"]

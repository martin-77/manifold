# cargo-deny configuration
# https://github.com/EmbarkStudios/cargo-deny
#
# NOTE: The workspace currently declares `license = "MIT OR Apache-2.0"` in
# Cargo.toml while README.md mentions only MIT and no LICENSE file exists in
# the repository. This inconsistency is intentionally NOT resolved here and
# is documented for upstream review (see docs/fork-review/AUDIT_PROGRESS.md).

[graph]
all-features = false

[advisories]
# R17: `unmaintained` is limited to workspace-owned dependencies on
# purpose. Transitive findings that cannot be fixed from this repo are
# documented here instead of silently tolerated by a future default
# change:
#
# - RUSTSEC-2026-0370 (zvariant), -0371 (zbus_names), -0372
#   (zvariant_derive): all INFO/unmaintained, NOT vulnerabilities. The
#   crates were merged into zbus 6.0 (2026-10-16) and the standalone
#   versions are final by design. They enter the graph only on Linux
#   via slint 1.18.1 -> i-slint-backend-winit -> zbus 5.19; verified
#   2026-11-27 that even slint 1.19.1 still pins zbus 5.14+, so no
#   upgrade path exists upstream yet. Re-check once slint moves to
#   zbus 6.
# - RUSTSEC-2026-0192 (ttf-parser): also INFO/unmaintained, transitive
#   via winit -> sctk-adwaita -> ab_glyph; likewise not fixable here.
#
# With `workspace`, any future UNMAINTAINED finding on a direct
# dependency still fails the build.
unmaintained = "workspace"

[licenses]
# Only fail on unknown/unsupported license expressions.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-2-Clause-Patent",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "OpenSSL",
    "Unlicense",
    "MPL-2.0",
    "LGPL-2.1",
    "LGPL-3.0",
    # Slint is tri-licensed: GPL-3.0-only OR Slint Royalty-free license OR
    # Slint Software License. The project uses Slint under the royalty-free
    # option (see slint docs); the custom LicenseRefs are not in the SPDX
    # database, hence listed here explicitly.
    "LicenseRef-Slint-Royalty-free-2.0",
    "LicenseRef-Slint-Software-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

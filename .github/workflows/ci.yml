name: CI

on:
  push:
    branches: [main, macos-dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format / Build / Lint / Test
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 was retired on 2026-11-02 (jobs requesting it were
          # cancelled instantly); macos-15 is the current arm64 label
          # (R14, per actions/runner-images docs).
          - os: macos-15 # Apple Silicon (arm64)
          - os: ubuntu-24.04
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain pinned in rust-toolchain.toml (concrete
      # version, R14) with rustfmt/clippy.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev libdbus-1-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build check
        run: cargo check --workspace --all-targets --locked

      # R15: the warning baseline is now zero (Slint viewport-* deprecations
      # renamed to content-*, unused dependencies removed, lints fixed at
      # the root); `-D warnings` keeps it that way.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked
        env:
          # Opt-in for tests that touch user session state (macOS
          # pasteboard/Trash). CI runners are ephemeral, so this is safe
          # there and skipped on developer machines.
          MANIFOLD_TEST_ALLOW_SESSION_STATE: 1

  msrv:
    name: MSRV check (cargo check on 1.92)
    # The dependency-driven MSRV (Slint 1.18 requires rustc >= 1.92);
    # verified here so the `rust-version` metadata in Cargo.toml stays
    # honest (R14).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@v2
      - name: Check against MSRV
        run: cargo check --workspace --all-targets --locked

  deny:
    name: cargo-deny (advisories / bans / licenses)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans advisories sources
